resolve_s3 = true
s3_prefix = "tams"
region = "eu-west-1"
capabilities = "CAPABILITY_IAM"
parameter_overrides = "VpcId=\"vpc-0d47a388c8c81be12\" VpcAZs=\"eu-west-1a,eu-west-1b\" PrivateSubnetIds=\"subnet-094c3f66b5e86debf,subnet-09655fc43093c1c51\" NeptuneDBInstanceClass=\"db.t4g.medium\" NeptuneServerlessConfiguration=\"1,128\" DeployWaf=\"No\" JwtIssuerUrl=\"\" LambdaAuthorizerArn=\"arn:aws:lambda:eu-west-1:703405601617:function:tams-entra-authorizer-prod-authorizer\""
image_repositories = []
tags = [
    "Owner=Alex Jones",
    "Environment=Production",
    "Product=TAMS"
]

[default.global.parameters]
region = "eu-west-1"

[dev.global.parameters]
region = "eu-west-1"

[prod.global.parameters]
region = "eu-west-1"

[dev-auth.build.parameters]
template_file = "entra_authorizer.yaml"

[dev-auth.deploy.parameters]
