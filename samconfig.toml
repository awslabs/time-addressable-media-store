capabilities = ["CAPABILITY_IAM"]
parameter_overrides = "TenantId=\"be189d14-1d13-4148-9edf-47fff7e918a8\" AllowedAudiences=\"api://8ab97629-3017-4d9e-907d-a7201a4ffd25\" LogLevel=\"INFO\""


